<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor - DeepScriptum</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📄</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Roboto+Mono:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- highlight.js для подсветки синтаксиса в превью -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">

    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --surface-lighter-color: #2a2a2a;
            /* Для активных элементов или фона textarea */
            --primary-color: #6200EE;
            --primary-variant-color: #3700B3;
            --secondary-color: #03DAC6;
            --text-color: #E0E0E0;
            --text-color-darker: #BDBDBD;
            --text-on-primary: #FFFFFF;
            --border-color: #333333;
            --error-color: #CF6679;
            --success-color: #03DAC5;
            --font-main: 'Inter', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            /* Чтобы избежать двойных скроллбаров */
        }

        .editor-layout {
            display: flex;
            height: 100vh;
        }

        /* --- Sidebar --- */
        .sidebar {
            width: 280px;
            background-color: var(--surface-color);
            padding: 20px;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border-color);
        }

        .sidebar-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text-color-darker);
            text-decoration: none;
            /* Если это ссылка на хаб */
        }

        .sidebar-logo .highlight {
            color: var(--primary-color);
            font-weight: 700;
        }

        .sidebar-upload-button {
            display: block;
            width: 100%;
            padding: 10px 15px;
            margin-top: 15px;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-align: center;
        }

        .sidebar-upload-button:hover {
            background-color: var(--primary-variant-color);
        }

        .sidebar-upload-button i {
            margin-right: 8px;
        }

        .sidebar input[type="file"] {
            display: none;
        }

        .sidebar-file-list-container {
            flex-grow: 1;
            overflow-y: auto;
            /* Скролл для списка файлов */
            margin-top: 10px;
        }

        .sidebar-file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-file-list li a {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            color: var(--text-color-darker);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 5px;
            transition: background-color 0.2s ease, color 0.2s ease;
            font-size: 0.9rem;
            word-break: break-word;
        }

        .sidebar-file-list li a:hover {
            background-color: var(--surface-lighter-color);
            color: var(--text-color);
        }

        .sidebar-file-list li a.active {
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            font-weight: 500;
        }

        .sidebar-file-list li a .file-icon {
            margin-right: 10px;
            width: 16px;
            /* Для выравнивания */
            text-align: center;
        }

        .sidebar-file-list li a .spinner {
            /* Спиннер для файла в обработке */
            border-width: 2px;
            width: 12px;
            height: 12px;
            margin-left: auto;
            /* Справа от имени файла */
            border-top-color: var(--secondary-color);
        }

        /* --- Main Content Area (Editor + Preview) --- */
        .main-editor-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* Предотвратить скролл основной области, если панели имеют свой */
        }

        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            min-height: 30px;
            /* Минимальная высота для кнопок */
        }

        .document-title-header {
            font-size: 1.2rem;
            font-weight: 500;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 50%;
            /* Чтобы не вытеснять кнопки */
        }

        .editor-actions button {
            background: none;
            border: 1px solid var(--text-color-darker);
            color: var(--text-color-darker);
            padding: 8px 15px;
            margin-left: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-family: var(--font-main);
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .editor-actions button:hover {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--text-on-primary);
        }

        .editor-actions button i {
            margin-right: 6px;
        }

        .editor-actions button.save-button {
            /* Особый стиль для кнопки Save */
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: var(--bg-color);
        }

        .editor-actions button.save-button:hover {
            background-color: #02c1ac;
            /* Чуть темнее secondary */
        }

        .editor-panels-container {
            display: flex;
            flex-grow: 1;
            /* Занимает все оставшееся место */
            overflow: hidden;
            /* Панели будут иметь свой скролл */
        }

        .editor-panel,
        .preview-panel {
            width: 50%;
            height: 100%;
            /* Занимает всю высоту .editor-panels-container */
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
            font-family: var(--font-mono);
            /* Моноширинный для редактора */
            font-size: 1rem;
            /* или 16px */
            line-height: 1.6;
        }

        .editor-panel {
            /* Markdown Editor (textarea) */
            background-color: var(--surface-lighter-color);
            /* Чуть светлее фона */
            color: var(--text-color);
            border: none;
            resize: none;
            /* Убрать возможность изменения размера */
            border-right: 1px solid var(--border-color);
            /* Разделитель */
        }

        .editor-panel:focus {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--primary-color);
            /* Внутренняя рамка при фокусе */
        }

        .preview-panel {
            /* Markdown Preview */
            background-color: var(--bg-color);
            /* Такой же как основной фон */
            color: var(--text-color);
            font-family: var(--font-main);
            /* Обычный шрифт для превью */
        }

        /* Стили для Markdown рендера в .preview-panel (пример) */
        .preview-panel h1,
        .preview-panel h2,
        .preview-panel h3 {
            color: var(--primary-color);
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .preview-panel h1 {
            font-size: 1.8em;
        }

        .preview-panel h2 {
            font-size: 1.5em;
        }

        .preview-panel h3 {
            font-size: 1.3em;
        }

        .preview-panel p {
            margin-bottom: 1em;
            line-height: 1.7;
        }

        .preview-panel a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .preview-panel a:hover {
            text-decoration: underline;
        }

        .preview-panel code {
            background-color: var(--surface-color);
            padding: 0.2em 0.4em;
            margin: 0;
            font-size: 85%;
            border-radius: 3px;
            font-family: var(--font-mono);
        }

        .preview-panel pre {
            background-color: var(--surface-color);
            padding: 1em;
            border-radius: 5px;
            overflow-x: auto;
        }

        .preview-panel pre code {
            padding: 0;
            background-color: transparent;
        }

        .preview-panel ul,
        .preview-panel ol {
            padding-left: 2em;
            margin-bottom: 1em;
        }

        .preview-panel blockquote {
            border-left: 3px solid var(--primary-variant-color);
            padding-left: 1em;
            margin-left: 0;
            color: var(--text-color-darker);
        }

        .preview-panel table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 1em;
        }

        .preview-panel th,
        .preview-panel td {
            border: 1px solid var(--border-color);
            padding: 0.5em;
        }

        .preview-panel th {
            background-color: var(--surface-color);
        }

        /* Спиннер для загрузки */
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(18, 18, 18, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .loading-overlay .spinner {
            width: 50px;
            height: 50px;
            border-width: 5px;
        }

        .spinner {
            /* Общий стиль для спиннеров */
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
            vertical-align: middle;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Share Modal (стили из home.html, если нужно) */
        /* ... (можно скопировать стили модального окна Share отсюда или импортировать) ... */
        #sharePopup {
            display: none;
            /* Начальное состояние */
        }

        /* ... скопируй стили для .modal, .modal-content и т.д. из home.html сюда ... */
        .modal {
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background-color: var(--surface-color);
            padding: 30px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            color: var(--text-color);
        }

        .modal-content h2 {
            margin-top: 0;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .close-modal-button {
            color: var(--text-color-darker);
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-modal-button:hover,
        .close-modal-button:focus {
            color: var(--primary-color);
            text-decoration: none;
        }

        .modal .form-group {
            margin-bottom: 15px;
        }

        .modal .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text-color-darker);
        }

        .modal .form-control {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .modal .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(98, 0, 238, 0.3);
        }

        .modal .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: var(--text-on-primary);
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .modal .btn-submit:hover {
            background-color: var(--primary-variant-color);
        }

        .upload-status {
            margin-top: 15px;
            font-size: 0.9rem;
        }

        /* Для сообщений в модалке */
        .upload-status.success {
            color: var(--success-color);
        }

        .upload-status.error {
            color: var(--error-color);
        }
    </style>
</head>

<body>
    <div class="editor-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <a href="/home" class="sidebar-logo">Deep<span class="highlight">Scriptum</span></a>
                <!-- Кнопка Upload в сайдбаре -->
                <input type="file" id="sidebarFileUploadInput" accept=".pdf" />
                <button type="button" class="sidebar-upload-button" id="sidebarBrowseButton">
                    <i class="fas fa-plus-circle"></i> New Document
                </button>
            </div>
            <div class="sidebar-file-list-container">
                <ul id="sidebarFileList">
                    <!-- Список файлов будет загружен сюда -->
                </ul>
            </div>
        </aside>

        <main class="main-editor-content">
            <div class="editor-header">
                <h1 id="documentTitleHeader">Loading document...</h1>
                <div class="editor-actions">
                    <button id="saveButton"><i class="fas fa-save"></i> Save</button>
                    <button id="shareButton"><i class="fas fa-share-alt"></i> Share</button>
                    <button id="downloadMDButton"><i class="fas fa-download"></i> Download MD</button>
                    <button id="logoutButton"><i class="fas fa-sign-out-alt"></i> Log Out</button>
                </div>
            </div>
            <div class="editor-panels-container">
                <textarea id="markdownEditor" class="editor-panel" placeholder="Start typing Markdown..."></textarea>
                <div id="previewPanel" class="preview-panel"></div>
            </div>
        </main>
    </div>

    <!-- Модальное окно Share (такое же, как в home.html) -->
    <div id="sharePopup" class="modal">
        <!-- ID изменен на sharePopup для соответствия JS из home.html, если будем его переиспользовать -->
        <div class="modal-content">
            <span class="close-modal-button" id="closeShareModalBtn">×</span>
            <h2>Share "<span id="shareModalDocName"></span>"</h2>
            <form id="shareForm">
                <input type="hidden" id="shareDocIdInput" name="docId">
                <div class="form-group">
                    <label for="shareUserEmail">User Email:</label>
                    <input type="email" id="shareUserEmail" name="email" class="form-control" required
                        placeholder="user@example.com">
                </div>
                <div class="form-group">
                    <label for="shareRoleSelect">Role:</label>
                    <select id="shareRoleSelect" name="role" class="form-control">
                        <option value="editor">Editor</option>
                        <option value="viewer">Viewer</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Access</button>
            </form>
            <div id="shareStatusMessage" class="upload-status" style="margin-top: 15px;"></div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay" style="display: none;">
        <div class="spinner"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script>

        const API_BASE_URL = 'http://0.0.0.0:8080/api';


        const markdownEditor = document.getElementById('markdownEditor');
        const previewPanel = document.getElementById('previewPanel');
        const documentTitleHeader = document.getElementById('documentTitleHeader');
        const sidebarFileList = document.getElementById('sidebarFileList');
        const loadingOverlay = document.getElementById('loadingOverlay');
        const saveButton = document.getElementById('saveButton');
        const shareButton = document.getElementById('shareButton');
        const downloadMDButton = document.getElementById('downloadMDButton');
        const logoutButton = document.getElementById('logoutButton');
        const sidebarBrowseButton = document.getElementById('sidebarBrowseButton');
        const sidebarFileUploadInput = document.getElementById('sidebarFileUploadInput');


        const shareModal = document.getElementById('sharePopup');
        const shareForm = document.getElementById('shareForm');
        const shareDocIdInput = document.getElementById('shareDocIdInput');
        const shareModalDocName = document.getElementById('shareModalDocName');
        const shareUserEmailInput = document.getElementById('shareUserEmail');
        const shareRoleSelect = document.getElementById('shareRoleSelect');
        const shareStatusMessage = document.getElementById('shareStatusMessage');
        const closeShareModalBtn = document.getElementById('closeShareModalBtn');


        let currentOpenDoc = {
            id: null,
            name: null,
            s3_md_id: null,
            content: '',
            isDirty: false
        };
        let renderTimeout;
        let saveTimeout;


        document.addEventListener('DOMContentLoaded', async () => {
            const authToken = localStorage.getItem("ds_auth_token");
            if (!authToken) {
                window.location.href = "/auth/login";
                return;
            }


            marked.setOptions({
                breaks: true,
                gfm: true,
                highlight: function (code, lang) {
                    const language = hljs.getLanguage(lang) ? lang : 'plaintext';
                    return hljs.highlight(code, { language, ignoreIllegals: true }).value;
                }
            });

            await loadSidebarDocuments();
            await loadDocumentFromUrl();

            markdownEditor.addEventListener('input', handleEditorInput);
            saveButton.addEventListener('click', () => autoSaveDocument(true));
            shareButton.addEventListener('click', openShareModalForCurrentDoc);
            downloadMDButton.addEventListener('click', downloadCurrentDocAsMD);
            logoutButton.addEventListener('click', handleLogout);

            sidebarBrowseButton.addEventListener('click', () => sidebarFileUploadInput.click());
            sidebarFileUploadInput.addEventListener('change', handleSidebarFileUpload);

            if (closeShareModalBtn) closeShareModalBtn.addEventListener('click', closeShareModalHandler);
            if (shareModal) shareModal.addEventListener('click', (event) => { if (event.target === shareModal) closeShareModalHandler(); });
            window.addEventListener('keydown', (event) => { if (event.key === 'Escape' && shareModal && shareModal.style.display === 'flex') closeShareModalHandler(); });
            if (shareForm) shareForm.addEventListener('submit', handleShareFormSubmit);
        });


        async function loadDocumentFromUrl() {
            const pathSegments = window.location.pathname.split('/');
            const docIdFromUrl = pathSegments[pathSegments.length - 1];

            if (docIdFromUrl && docIdFromUrl !== 'editor' && docIdFromUrl !== 'new') {
                await fetchAndDisplayDocument(docIdFromUrl);
            } else if (docIdFromUrl === 'new') {

                currentOpenDoc = { id: 'new', name: 'New Document', s3_md_id: null, content: '', isDirty: false };
                updateEditorWithDocData();
                documentTitleHeader.textContent = currentOpenDoc.name;

            } else {
                documentTitleHeader.textContent = "Select a document or create new";
                markdownEditor.value = "";
                previewPanel.innerHTML = "";

                const firstDocLink = sidebarFileList.querySelector('li a');
                if (firstDocLink) {
                    await fetchAndDisplayDocument(firstDocLink.dataset.docId);
                }
            }
        }


        async function fetchAndDisplayDocument(docDbId) {
            if (!docDbId || docDbId === 'new') return;


            if (currentOpenDoc.id && currentOpenDoc.id !== docDbId && currentOpenDoc.isDirty) {
                if (!confirm("You have unsaved changes in the current document. Are you sure you want to switch?")) {
                    return;
                }
            }

            showLoadingOverlay(true);
            const token = localStorage.getItem("ds_auth_token");
            try {

                const response = await fetch(`${API_BASE_URL}/documents/${docDbId}/content`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    if (response.status === 401) { window.location.href = "/auth/login"; return; }
                    const errData = await response.json().catch(() => ({ detail: `Error loading document (Status: ${response.status})` }));
                    throw new Error(errData.detail || `Failed to load document.`);
                }
                const data = await response.json();
                currentOpenDoc = {
                    id: data.id,
                    name: data.name,
                    s3_md_id: data.s3_md_id,
                    content: data.content,
                    isDirty: false
                };
                updateEditorWithDocData();

                history.pushState({ docId: data.id }, data.name, `/editor/${data.id}`);
                setActiveSidebarItem(data.id);

            } catch (error) {
                console.error("Error fetching document:", error);
                documentTitleHeader.textContent = "Error loading document";
                markdownEditor.value = `# Error \n\n ${error.message}`;
                renderMarkdown();
            } finally {
                showLoadingOverlay(false);
            }
        }

        function updateEditorWithDocData() {
            markdownEditor.value = currentOpenDoc.content;
            documentTitleHeader.textContent = currentOpenDoc.name || "Untitled Document";
            renderMarkdown();
            currentOpenDoc.isDirty = false;
            updateSaveButtonState();
        }


        function renderMarkdown() {
            previewPanel.innerHTML = marked.parse(markdownEditor.value);

            previewPanel.querySelectorAll('pre code').forEach((block) => {
                hljs.highlightElement(block);
            });
        }

        function handleEditorInput() {
            currentOpenDoc.isDirty = true;
            updateSaveButtonState();
            clearTimeout(renderTimeout);
            renderTimeout = setTimeout(renderMarkdown, 300);


            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => autoSaveDocument(false), 3000);
        }

        function updateSaveButtonState() {
            if (currentOpenDoc.isDirty) {
                saveButton.innerHTML = '<i class="fas fa-save"></i> Save*';
                saveButton.style.borderColor = 'var(--secondary-color)';
            } else {
                saveButton.innerHTML = '<i class="fas fa-save"></i> Save';
                saveButton.style.borderColor = 'var(--text-color-darker)';
            }
        }

        async function autoSaveDocument(forceSave = false) {
            if ((!currentOpenDoc.isDirty && !forceSave) || !currentOpenDoc.id || currentOpenDoc.id === 'new') {
                if (currentOpenDoc.id === 'new' && forceSave) {
                    alert("Saving a new document is not fully implemented yet. It needs to be created on the server first.");
                }
                return;
            }
            if (!currentOpenDoc.s3_md_id) {
                console.warn("Cannot save, document s3_md_id is missing.");
                alert("Cannot save document: critical metadata is missing.");
                return;
            }

            const token = localStorage.getItem("ds_auth_token");
            const contentToSave = markdownEditor.value;
            saveButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving...';

            try {
                const response = await fetch(`${API_BASE_URL}/documents/${currentOpenDoc.s3_md_id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ content: contentToSave })
                });

                if (!response.ok) {
                    if (response.status === 401) { window.location.href = "/auth/login"; return; }
                    const errData = await response.json().catch(() => ({ detail: `Error saving (Status: ${response.status})` }));
                    throw new Error(errData.detail || "Failed to save document.");
                }
                currentOpenDoc.content = contentToSave;
                currentOpenDoc.isDirty = false;
                updateSaveButtonState();
                console.log("Document saved successfully.");

            } catch (error) {
                console.error("Error saving document:", error);
                alert(`Error saving document: ${error.message}`);
                saveButton.innerHTML = '<i class="fas fa-exclamation-circle"></i> Error';
                setTimeout(updateSaveButtonState, 2000);
            }
        }



        async function loadSidebarDocuments() {
            const token = localStorage.getItem("ds_auth_token");
            sidebarFileList.innerHTML = '<li>Loading files...</li>';
            try {
                const response = await fetch(`${API_BASE_URL}/documents/`, {
                    headers: { 'Authorization': `Bearer ${token}`, 'Accept': 'application/json' }
                });
                if (!response.ok) {
                    if (response.status === 401) { window.location.href = "/auth/login"; return; }
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                const data = await response.json();
                sidebarFileList.innerHTML = '';

                if (Object.keys(data).length === 0) {
                    sidebarFileList.innerHTML = '<li>No documents yet.</li>';
                    return;
                }
                for (const docDbId in data) {
                    const docDetails = data[docDbId];
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `/editor/${docDbId}`;
                    a.dataset.docId = docDbId;
                    a.dataset.s3MdId = docDetails.s3_md_id;

                    let iconClass = 'fa-file-alt';
                    let spinnerHtml = '';
                    if (docDetails.s3_md_id === "0" || docDetails.s3_md_id === null || docDetails.s3_md_id === "None") {
                        iconClass = 'fa-history';
                        spinnerHtml = '<span class="spinner"></span>';


                    }

                    a.innerHTML = `<span class="file-icon"><i class="fas ${iconClass}"></i></span> ${docDetails.name || 'Untitled'} ${spinnerHtml}`;

                    a.addEventListener('click', (e) => {
                        e.preventDefault();
                        fetchAndDisplayDocument(docDbId);
                    });
                    li.appendChild(a);
                    sidebarFileList.appendChild(li);
                }
                setActiveSidebarItem(currentOpenDoc.id);

            } catch (error) {
                console.error("Error loading sidebar documents:", error);
                sidebarFileList.innerHTML = '<li>Error loading files.</li>';
            }
        }

        function setActiveSidebarItem(docDbId) {
            sidebarFileList.querySelectorAll('a').forEach(link => {
                link.classList.remove('active');
                if (link.dataset.docId === docDbId) {
                    link.classList.add('active');
                }
            });
        }


        async function handleSidebarFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.type !== "application/pdf") {
                alert("Only PDF files are allowed.");
                sidebarFileUploadInput.value = '';
                return;
            }


            const token = localStorage.getItem("ds_auth_token");
            const formData = new FormData();
            formData.append('document', file);

            try {
                const response = await fetch(`${API_BASE_URL}/documents/ocr`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: formData
                });
                if (!response.ok) {
                    const errData = await response.json().catch(() => ({ detail: "Upload failed" }));
                    throw new Error(errData.detail);
                }
                const result = await response.json();

                await loadSidebarDocuments();


                alert(`File "${file.name}" uploaded. Task ID: ${result.doc_id}. It will appear in the list once processed.`);

            } catch (error) {
                console.error("Sidebar upload error:", error);
                alert(`Error uploading file: ${error.message}`);
            } finally {
                sidebarFileUploadInput.value = '';
            }
        }



        function showLoadingOverlay(show) {
            loadingOverlay.style.display = show ? 'flex' : 'none';
        }

        function handleLogout() {
            localStorage.removeItem("ds_auth_token");
            window.location.href = "/";
        }

        function downloadCurrentDocAsMD() {
            if (!currentOpenDoc || currentOpenDoc.id === 'new') {
                alert("No document is open or it's a new unsaved document.");
                return;
            }
            const markdownContent = markdownEditor.value;
            const fileName = (currentOpenDoc.name || "document") + ".md";
            const blob = new Blob([markdownContent], { type: 'text/markdown;charset=utf-8;' });
            const link = document.createElement("a");
            if (link.download !== undefined) {
                const url = URL.createObjectURL(blob);
                link.setAttribute("href", url);
                link.setAttribute("download", fileName);
                link.style.visibility = 'hidden';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }
        }


        function openShareModalForCurrentDoc() {
            if (!currentOpenDoc || !currentOpenDoc.id || currentOpenDoc.id === 'new') {
                alert("Please open or save a document before sharing.");
                return;
            }

            if (shareDocIdInput) shareDocIdInput.value = currentOpenDoc.id;
            if (shareModalDocName) shareModalDocName.textContent = currentOpenDoc.name || "Untitled";
            if (shareUserEmailInput) shareUserEmailInput.value = '';
            if (shareRoleSelect) shareRoleSelect.value = 'editor';
            if (shareStatusMessage) {
                shareStatusMessage.textContent = '';
                shareStatusMessage.className = 'upload-status';
            }
            if (shareModal) shareModal.style.display = 'flex';
        }

        function closeShareModalHandler() {
            if (shareModal) shareModal.style.display = 'none';
        }

        async function handleShareFormSubmit(event) {
            event.preventDefault();
            const docId = shareDocIdInput.value;
            const email = shareUserEmailInput.value;
            const role = shareRoleSelect.value;
            const token = localStorage.getItem("ds_auth_token");

            if (!token) { /* ... обработка ошибки ... */ return; }

            if (shareStatusMessage) {
                shareStatusMessage.textContent = "Sharing...";
                shareStatusMessage.className = 'upload-status';

            }

            try {
                const response = await fetch(`${API_BASE_URL}/documents/${docId}/share`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ email: email, role: role })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || `HTTP error ${response.status}`);

                if (shareStatusMessage) {
                    shareStatusMessage.textContent = data.message || "Access granted!";
                    shareStatusMessage.classList.add('success');
                }
            } catch (error) {
                console.error('Share error:', error);
                if (shareStatusMessage) {
                    shareStatusMessage.textContent = `Error: ${error.message}`;
                    shareStatusMessage.classList.add('error');
                }
            }
        }

    </script>
</body>
